<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Ely QT</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;

    display: flex;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(
            circle at 50% 35%,
            #fffaf5 0%,
            #f9eee6 45%,
            #f3ddd5 100%
        );
}


/* =====================================================
   CONTAINER
===================================================== */

.scene {
    width: min(100vw, 900px);
    height: min(100vh, 950px);

    display: flex;
    justify-content: center;
    align-items: center;

    position: relative;
}

svg {
    width: 100%;
    height: 100%;

    overflow: visible;
}


/* =====================================================
   FLOWERS
===================================================== */

.flower {
    transform-box: fill-box;
    transform-origin: center bottom;

    animation:
        flowerSway 5s ease-in-out infinite;
}

.flower.left {
    animation-delay: -.8s;
}

.flower.right {
    animation-delay: -1.7s;
}

.flower.center {
    animation-duration: 5.5s;
}

@keyframes flowerSway {

    0%,
    100% {
        transform:
            rotate(-1deg)
            translateY(0);
    }

    50% {
        transform:
            rotate(1.5deg)
            translateY(-3px);
    }
}


/* =====================================================
   LEAVES
===================================================== */

.leaf {
    transform-box: fill-box;
    transform-origin: bottom center;

    animation:
        leafSway 4s ease-in-out infinite;
}

.leaf:nth-child(2) {
    animation-delay: -.7s;
}

.leaf:nth-child(3) {
    animation-delay: -1.4s;
}

.leaf:nth-child(4) {
    animation-delay: -2s;
}

@keyframes leafSway {

    0%,
    100% {
        transform: rotate(0deg);
    }

    50% {
        transform: rotate(3deg);
    }
}


/* =====================================================
   CAT 1 — PEEKING
===================================================== */

.cat-peeking {

    transform-box: fill-box;
    transform-origin: center bottom;

    animation:
        peek 5s cubic-bezier(.45,.05,.55,.95) infinite;
}

@keyframes peek {

    0%,
    100% {
        transform:
            translateY(9px)
            rotate(0deg);
    }

    20% {
        transform:
            translateY(0)
            rotate(-1deg);
    }

    30% {
        transform:
            translateY(-4px)
            rotate(1deg);
    }

    45% {
        transform:
            translateY(0)
            rotate(0deg);
    }

    75% {
        transform:
            translateY(3px)
            rotate(-.5deg);
    }
}


/* =====================================================
   CAT 1 EARS
===================================================== */

.ear-left {
    transform-box: fill-box;
    transform-origin: bottom right;

    animation:
        earLeft 6s ease-in-out infinite;
}

.ear-right {
    transform-box: fill-box;
    transform-origin: bottom left;

    animation:
        earRight 7s ease-in-out infinite;
}

@keyframes earLeft {

    0%,
    82%,
    100% {
        transform: rotate(0deg);
    }

    86% {
        transform: rotate(-7deg);
    }

    90% {
        transform: rotate(2deg);
    }
}

@keyframes earRight {

    0%,
    45%,
    100% {
        transform: rotate(0deg);
    }

    48% {
        transform: rotate(6deg);
    }

    52% {
        transform: rotate(-2deg);
    }
}


/* =====================================================
   CAT 2 — BREATHING
===================================================== */

.cat-sitting {

    transform-box: fill-box;
    transform-origin: center bottom;

    animation:
        catBreathing 4.2s ease-in-out infinite;
}

@keyframes catBreathing {

    0%,
    100% {
        transform:
            translateY(0)
            scale(1);
    }

    50% {
        transform:
            translateY(-3px)
            scale(1.008);
    }
}


/* =====================================================
   CAT 2 HEAD
===================================================== */

.cat-head {

    transform-box: fill-box;
    transform-origin: center bottom;

    animation:
        headTilt 8s ease-in-out infinite;
}

@keyframes headTilt {

    0%,
    30%,
    100% {
        transform: rotate(0deg);
    }

    40% {
        transform: rotate(-3deg);
    }

    50% {
        transform: rotate(-3deg);
    }

    60% {
        transform: rotate(1deg);
    }

    70% {
        transform: rotate(0deg);
    }
}


/* =====================================================
   CAT 2 TAIL
===================================================== */

.cat-tail {

    transform-box: fill-box;
    transform-origin: 0% 80%;

    animation:
        tailSway 4s ease-in-out infinite;
}

@keyframes tailSway {

    0%,
    100% {
        transform: rotate(0deg);
    }

    50% {
        transform: rotate(9deg);
    }
}


/* =====================================================
   BLINKING
===================================================== */

.eye {

    transform-box: fill-box;
    transform-origin: center;

    animation:
        blink 5.5s infinite;
}

.cat2-eye {

    transform-box: fill-box;
    transform-origin: center;

    animation:
        blink2 7s infinite;
}

@keyframes blink {

    0%,
    43%,
    46%,
    100% {
        transform: scaleY(1);
    }

    44%,
    45% {
        transform: scaleY(.08);
    }
}

@keyframes blink2 {

    0%,
    60%,
    63%,
    100% {
        transform: scaleY(1);
    }

    61%,
    62% {
        transform: scaleY(.08);
    }
}


/* =====================================================
   CAT 2 PAW
===================================================== */

.paw {

    transform-box: fill-box;
    transform-origin: center top;

    animation:
        pawMove 5s ease-in-out infinite;
}

@keyframes pawMove {

    0%,
    100% {
        transform: rotate(0deg);
    }

    50% {
        transform: rotate(-2deg);
    }
}


/* =====================================================
   FLOATING PETALS
===================================================== */

.petal-float {
    animation:
        floatPetal 7s ease-in-out infinite;
}

.petal-float.two {
    animation-delay: -3s;
}

.petal-float.three {
    animation-delay: -5s;
}

@keyframes floatPetal {

    0% {
        opacity: 0;
        transform:
            translate(0, -20px)
            rotate(0deg);
    }

    15% {
        opacity: .8;
    }

    50% {
        transform:
            translate(25px, 35px)
            rotate(80deg);
    }

    85% {
        opacity: .6;
    }

    100% {
        opacity: 0;
        transform:
            translate(-15px, 85px)
            rotate(160deg);
    }
}


/* =====================================================
   SPARKLES
===================================================== */

.sparkle {

    transform-box: fill-box;
    transform-origin: center;

    animation:
        sparkle 3s ease-in-out infinite;
}

.sparkle:nth-child(2) {
    animation-delay: -1s;
}

.sparkle:nth-child(3) {
    animation-delay: -2s;
}

@keyframes sparkle {

    0%,
    100% {
        opacity: .25;
        transform: scale(.65);
    }

    50% {
        opacity: 1;
        transform: scale(1.15);
    }
}


/* =====================================================
   RIBBON
===================================================== */

.ribbon {

    transform-box: fill-box;
    transform-origin: center top;

    animation:
        ribbonMove 4s ease-in-out infinite;
}

@keyframes ribbonMove {

    0%,
    100% {
        transform: rotate(0deg);
    }

    50% {
        transform: rotate(1deg);
    }
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .scene {
        width: 100vw;
        height: 100vh;
    }

    svg {
        width: 100vw;
        height: 100vh;
    }
}

@media (max-width: 420px) {

    svg {
        transform: scale(.94);
    }
}

@media (max-height: 700px) {

    svg {
        transform: scale(.84);
    }
}

@media (max-height: 580px) {

    svg {
        transform: scale(.70);
    }
}

</style>
</head>
